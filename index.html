<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0D141B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Rotina">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icon.svg">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<title>Rotina</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0D141B; --panel:#141F2A; --panel-2:#1B2936; --edge:#243543;
  --line1:#2BB3C0; --line2:#E8A33D; --signal:#E2574C;
  --chalk:#E6EDF2; --dim:#7A8B99; --dimmer:#4E5F6D;
  --display:"Barlow Condensed","Oswald","Arial Narrow",system-ui,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --pad:18px; --nav-h:62px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--ink);color:var(--chalk);font-family:var(--body);
  font-size:15px;line-height:1.55;
  padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom));
  -webkit-font-smoothing:antialiased;
}

.masthead{position:sticky;top:0;z-index:40;background:linear-gradient(180deg,var(--ink) 72%,rgba(13,20,27,0));padding:calc(env(safe-area-inset-top) + 14px) var(--pad) 14px}
.masthead-row{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.today-name{font-family:var(--display);font-size:34px;font-weight:700;letter-spacing:.055em;text-transform:uppercase;line-height:1;margin:0}
.clock{font-family:var(--display);font-size:30px;font-weight:500;line-height:1;color:var(--line1);font-variant-numeric:tabular-nums}
.today-sub{font-family:var(--display);font-size:14px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);margin-top:7px}
.today-sub .badge{color:var(--line2)}
.today-sub .badge.rest{color:var(--dimmer)}

.view{display:none;padding:4px var(--pad) 32px;animation:rise .3s ease}
.view.on{display:block}
@keyframes rise{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}

h2.sec{font-family:var(--display);font-size:13px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:var(--dim);margin:30px 0 12px;display:flex;align-items:center;gap:10px}
h2.sec::after{content:"";flex:1;height:1px;background:var(--edge)}
h2.sec:first-child{margin-top:14px}
h3.sub{font-family:var(--display);font-size:20px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--chalk);margin:26px 0 10px}

.card{background:var(--panel);border:1px solid var(--edge);border-radius:13px;padding:16px;margin-bottom:12px}
.note{border-left:3px solid var(--line2);background:var(--panel);border-radius:0 10px 10px 0;padding:13px 15px;font-size:14px;color:#CBD7E0;margin:12px 0}
.note strong{color:var(--chalk)}
.note.alert{border-left-color:var(--signal)}
.note.quiet{border-left-color:var(--dimmer);color:var(--dim);font-size:13px}
.note.info{border-left-color:var(--line1)}

/* rota */
.route{position:relative;margin:6px 0 0}
.stop{position:relative;display:grid;grid-template-columns:58px 26px 1fr;align-items:start;gap:0 12px;padding:9px 0}
.stop::before{content:"";position:absolute;left:82px;top:0;bottom:0;width:2px;background:var(--edge)}
.stop:first-child::before{top:22px}
.stop:last-child::before{bottom:calc(100% - 22px)}
.stop .t{font-family:var(--display);font-size:20px;font-weight:600;line-height:1.25;color:var(--dim);font-variant-numeric:tabular-nums;text-align:right;padding-top:1px}
.stop .dot{position:relative;z-index:2;width:12px;height:12px;border-radius:50%;background:var(--ink);border:2px solid var(--dimmer);margin:7px auto 0}
.stop .lbl{font-size:15px;color:#B9C7D2;padding-top:1px}
.stop .lbl small{display:block;font-size:12.5px;color:var(--dim);margin-top:1px}
.stop.done .t,.stop.done .lbl,.stop.done .lbl small{color:var(--dimmer)}
.stop.key .dot{border-color:var(--line1);background:var(--line1);width:14px;height:14px;margin-top:6px}
.stop.key .t{color:var(--line1)}
.stop.key .lbl{color:var(--chalk);font-weight:600}
.stop.gym .dot{border-color:var(--line2);background:var(--line2);width:16px;height:16px;margin-top:5px}
.stop.gym .t{color:var(--line2);font-size:23px}
.stop.gym .lbl{color:var(--line2);font-weight:600;font-family:var(--display);font-size:21px;letter-spacing:.09em;text-transform:uppercase}
.stop.gym .lbl small{font-family:var(--body);letter-spacing:0;text-transform:none;font-size:12.5px;color:var(--dim);font-weight:400}
.stop.now .dot{border-color:var(--signal);background:var(--signal);box-shadow:0 0 0 5px rgba(226,87,76,.18)}
.stop.now .t{color:var(--signal)}
.stop.now .lbl{color:#fff}

table{width:100%;border-collapse:collapse;font-size:14px}
th{font-family:var(--display);font-size:12px;font-weight:600;letter-spacing:.15em;text-transform:uppercase;color:var(--dim);text-align:left;padding:0 10px 8px 0;border-bottom:1px solid var(--edge)}
td{padding:10px 10px 10px 0;border-bottom:1px solid rgba(36,53,67,.55);vertical-align:top}
tr:last-child td{border-bottom:none}
td:last-child,th:last-child{padding-right:0;text-align:right}
.num{font-family:var(--display);font-size:17px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--line1);white-space:nowrap}
.muted{color:var(--dim)}

.week{display:flex;flex-direction:column;gap:8px}
.day{display:grid;grid-template-columns:52px 1fr auto;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--edge);border-left:3px solid var(--edge);border-radius:10px;padding:13px 15px}
.day.train{border-left-color:var(--line2)}
.day.here{border-color:var(--line1);border-left-color:var(--line1);background:var(--panel-2)}
.day .abbr{font-family:var(--display);font-size:16px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--dim)}
.day.train .abbr{color:var(--chalk)}
.day.here .abbr{color:var(--line1)}
.day .what{font-size:14.5px;font-weight:500}
.day .what small{display:block;font-size:12.5px;color:var(--dim);font-weight:400;margin-top:1px}
.day .hour{font-family:var(--display);font-size:20px;font-weight:600;color:var(--line2);font-variant-numeric:tabular-nums}
.day.rest .what,.day.rest .hour{color:var(--dimmer)}

.macros{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.macro{background:var(--panel);border:1px solid var(--edge);border-radius:10px;padding:12px 8px;text-align:center}
.macro .v{font-family:var(--display);font-size:26px;font-weight:700;line-height:1;color:var(--line1);font-variant-numeric:tabular-nums}
.macro.kcal .v{color:var(--line2)}
.macro .k{font-family:var(--display);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);margin-top:6px}

/* blocos expansíveis (refeições e treinos) */
.fold{background:var(--panel);border:1px solid var(--edge);border-radius:12px;overflow:hidden;margin-bottom:9px}
.fold summary{list-style:none;cursor:pointer;padding:14px 15px;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px}
.fold summary::-webkit-details-marker{display:none}
.fold .idx{font-family:var(--display);font-size:13px;font-weight:700;letter-spacing:.1em;color:var(--line2);border:1px solid var(--edge);border-radius:6px;padding:3px 7px;min-width:30px;text-align:center}
.fold .nm{font-size:15px;font-weight:600}
.fold .nm small{display:block;font-size:12.5px;color:var(--dim);font-weight:400;margin-top:1px}
.fold .kc{font-family:var(--display);font-size:17px;font-weight:600;color:var(--dim);font-variant-numeric:tabular-nums}
.fold[open] .kc{color:var(--line1)}
.fold .corpo{border-top:1px solid var(--edge);padding:4px 15px 14px}
.fold ul.itens{margin:0;padding:2px 0 0 20px}
.fold ul.itens li{padding:5px 0;font-size:14px;color:#C3D0DA}
.fold ul.itens li em{color:var(--line2);font-style:normal}
.fold.hoje{border-color:var(--line2)}
.fold.hoje .idx{background:var(--line2);color:var(--ink);border-color:var(--line2)}

/* exercícios */
.ex{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:11px 0;border-bottom:1px solid rgba(36,53,67,.55)}
.ex:last-child{border-bottom:none}
.ex .n{font-size:14.5px;color:var(--chalk);font-weight:500}
.ex .r{font-family:var(--display);font-size:17px;font-weight:600;color:var(--line1);font-variant-numeric:tabular-nums;white-space:nowrap}
.ex .h{grid-column:1/-1;font-size:12px;color:var(--dimmer);font-family:var(--display);letter-spacing:.08em}
.ex .d{grid-column:1/-1;font-size:12.5px;color:var(--dim);margin-top:3px}

.rules{list-style:none;margin:0;padding:0}
.rules li{padding:12px 0 12px 26px;position:relative;border-bottom:1px solid rgba(36,53,67,.55);font-size:14.5px;color:#C3D0DA}
.rules li:last-child{border-bottom:none}
.rules li::before{content:"";position:absolute;left:6px;top:19px;width:7px;height:7px;border-radius:50%;background:var(--line1)}
.rules li b{color:var(--chalk);font-weight:600}

/* registro */
.marks{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:2px 0 4px}
.mark{appearance:none;cursor:pointer;text-align:left;background:var(--panel);border:1px solid var(--edge);border-radius:12px;padding:14px 15px;color:var(--dim);font-family:var(--body);font-size:14px;display:flex;align-items:center;gap:11px;transition:background .16s,border-color .16s,color .16s}
.mark .box{width:22px;height:22px;border-radius:7px;flex:none;border:2px solid var(--dimmer);position:relative;transition:inherit}
.mark .box::after{content:"";position:absolute;left:6px;top:2px;width:6px;height:11px;border:solid var(--ink);border-width:0 2.5px 2.5px 0;transform:rotate(42deg) scale(0);transition:transform .18s cubic-bezier(.3,1.5,.6,1)}
.mark .cap{font-family:var(--display);font-size:15px;font-weight:600;letter-spacing:.11em;text-transform:uppercase;line-height:1.1}
.mark .cap small{display:block;font-family:var(--body);font-size:11.5px;letter-spacing:0;text-transform:none;color:var(--dimmer);font-weight:400;margin-top:2px}
.mark.on{color:var(--chalk)}
.mark.t.on{border-color:var(--line2);background:rgba(232,163,61,.12)}
.mark.t.on .box{border-color:var(--line2);background:var(--line2)}
.mark.d.on{border-color:var(--line1);background:rgba(43,179,192,.12)}
.mark.d.on .box{border-color:var(--line1);background:var(--line1)}
.mark.on .box::after{transform:rotate(42deg) scale(1)}
.mark:disabled{opacity:.4;cursor:default}
.mark:focus-visible{outline:2px solid var(--line1);outline-offset:2px}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--panel);border:1px solid var(--edge);border-radius:11px;padding:14px 8px;text-align:center}
.stat .v{font-family:var(--display);font-size:30px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.stat .v span{font-size:16px;font-weight:500;color:var(--dim)}
.stat.t .v{color:var(--line2)}
.stat.d .v{color:var(--line1)}
.stat.s .v{color:var(--chalk)}
.stat .k{font-family:var(--display);font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--dim);margin-top:7px;line-height:1.35}

.calhead,.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.calhead{margin-bottom:6px}
.calhead div{font-family:var(--display);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--dimmer);text-align:center}
.cell{appearance:none;cursor:pointer;font-family:inherit;background:var(--panel);border:1px solid var(--edge);border-radius:9px;padding:7px 2px 6px;display:flex;flex-direction:column;align-items:center;gap:5px;transition:border-color .16s,background .16s}
.cell .d{font-family:var(--display);font-size:15px;font-weight:600;color:var(--dim);font-variant-numeric:tabular-nums;line-height:1}
.cell .pips{display:flex;gap:3px;height:6px}
.cell .pip{width:6px;height:6px;border-radius:50%;background:var(--edge)}
.cell .pip.t.on{background:var(--line2)}
.cell .pip.d.on{background:var(--line1)}
.cell .pip.off{background:transparent;border:1px solid var(--edge)}
.cell.future{opacity:.3;cursor:default}
.cell.today{border-color:var(--line1)}
.cell.today .d{color:var(--line1)}
.cell.sel{background:var(--panel-2);border-color:var(--chalk)}
.cell.sel .d{color:var(--chalk)}

.legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:12px;font-size:12.5px;color:var(--dim)}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:8px;height:8px;border-radius:50%;display:block}
.selday{font-family:var(--display);font-size:15px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);margin:0 0 10px}
.selday b{color:var(--chalk);font-weight:600}
.wipe{appearance:none;cursor:pointer;width:100%;background:none;border:1px solid var(--edge);border-radius:10px;padding:12px;color:var(--dimmer);font-family:var(--display);font-size:13px;letter-spacing:.16em;text-transform:uppercase}
.wipe:active{color:var(--signal);border-color:var(--signal)}

nav{position:fixed;left:0;right:0;bottom:0;z-index:60;display:grid;grid-template-columns:repeat(5,1fr);background:rgba(13,20,27,.94);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--edge);padding-bottom:env(safe-area-inset-bottom)}
nav button{appearance:none;background:none;border:none;cursor:pointer;padding:10px 1px 11px;color:var(--dimmer);font-family:var(--display);font-size:11px;font-weight:600;letter-spacing:.11em;text-transform:uppercase;display:flex;flex-direction:column;align-items:center;gap:5px;border-top:2px solid transparent;margin-top:-1px;transition:color .18s}
nav button .ico{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--line1);border-top-color:var(--line1)}
nav button:focus-visible{outline:2px solid var(--line1);outline-offset:-3px}

.foot{margin-top:26px;padding-top:16px;border-top:1px solid var(--edge);font-size:12.5px;color:var(--dimmer);line-height:1.6}

/* carga por exercício */
.carga{grid-column:1/-1;margin-top:10px}
.ult{font-family:var(--display);font-size:14px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--line2)}
.ult.vazio{color:var(--dimmer);font-weight:400}
.ult span{color:var(--dim);font-weight:400}
.campos{display:flex;align-items:center;gap:6px;margin-top:8px}
.in{flex:1 1 0;min-width:0;height:38px;padding:0 4px;background:var(--ink);border:1px solid var(--edge);border-radius:9px;
  color:var(--chalk);font-family:var(--display);font-size:17px;font-weight:600;font-variant-numeric:tabular-nums;text-align:center}
.in::placeholder{color:var(--dimmer);font-weight:400}
.in:focus{outline:none;border-color:var(--line1)}
.in.erro{border-color:var(--signal)}
.vezes{flex:0 0 auto;color:var(--dimmer);font-size:13px}
.bt{appearance:none;cursor:pointer;flex:0 0 auto;height:38px;padding:0 11px;background:none;border:1px solid var(--edge);border-radius:9px;
  color:var(--dim);font-family:var(--display);font-size:12.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase}
.bt:focus-visible{outline:2px solid var(--line1);outline-offset:2px}
.bt.salvar.ok{color:var(--line1);border-color:var(--line1)}
.bt.desc{color:var(--line2);border-color:rgba(232,163,61,.45);font-size:14px;letter-spacing:.04em;font-variant-numeric:tabular-nums}
.spark{margin-top:9px}

/* gráficos */
svg.graf{display:block;width:100%;height:auto}
svg.graf .gt{font-family:var(--display);font-size:11px;letter-spacing:.06em;fill:var(--dim)}
.pick{width:100%;appearance:none;background:var(--panel);border:1px solid var(--edge);border-radius:10px;
  color:var(--chalk);font-family:var(--body);font-size:14px;padding:12px 13px}
.pick:focus{outline:none;border-color:var(--line1)}
.resumo{font-family:var(--display);font-size:15px;letter-spacing:.11em;text-transform:uppercase;color:var(--dim);margin:12px 0 0}
.resumo b{color:var(--line2);font-weight:700}
.resumo.d b{color:var(--line1)}
.wipe + .wipe{margin-top:8px}

/* meu plano: exportar, colar, importar */
.acao{appearance:none;cursor:pointer;display:block;width:100%;background:none;border:1px solid var(--edge);border-radius:10px;padding:12px;
  color:var(--dim);font-family:var(--display);font-size:13px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;text-align:center}
.acao:active{color:var(--chalk);border-color:var(--chalk)}
.acao:focus-visible{outline:2px solid var(--line1);outline-offset:2px}
.acao + .acao,.acao + .wipe,.cola + .acao{margin-top:8px}
.cola{display:block;width:100%;min-height:96px;margin-top:8px;resize:vertical;padding:11px;
  background:var(--ink);border:1px solid var(--edge);border-radius:10px;color:var(--chalk);
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;line-height:1.5}
.cola:focus{outline:none;border-color:var(--line1)}
.erros{margin:0;padding:0 0 0 18px}
.erros li{font-size:13px;color:#CBD7E0;padding:3px 0}

/* painel do editor */
.painel{position:fixed;inset:0;z-index:70;display:flex;flex-direction:column;background:var(--ink)}
.painel[hidden]{display:none}
.painel-topo{flex:none;display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:calc(env(safe-area-inset-top) + 14px) var(--pad) 13px;border-bottom:1px solid var(--edge);background:var(--panel)}
.painel-topo h2{margin:0;font-family:var(--display);font-size:23px;font-weight:700;letter-spacing:.09em;text-transform:uppercase}
.painel-corpo{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px var(--pad) calc(env(safe-area-inset-bottom) + 40px)}

/* formulários do editor */
.grupo{background:var(--panel);border:1px solid var(--edge);border-radius:12px;padding:13px 14px;margin-bottom:9px}
.grupo + .grupo{margin-top:0}
.grupo-tit{font-family:var(--display);font-size:15px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--chalk);margin-bottom:10px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.grupo-tit .abbr{color:var(--line1)}
.linha{display:flex;align-items:center;gap:6px;margin-bottom:7px}
.linha:last-child{margin-bottom:0}
.rot{font-family:var(--display);font-size:12px;letter-spacing:.13em;text-transform:uppercase;color:var(--dim);margin:11px 0 5px}
.campo{width:100%;min-width:0;height:38px;padding:0 10px;background:var(--ink);border:1px solid var(--edge);border-radius:9px;
  color:var(--chalk);font-family:var(--body);font-size:14px}
.campo:focus{outline:none;border-color:var(--line1)}
.campo.hora,.campo.n{font-family:var(--display);font-size:16px;font-weight:600;font-variant-numeric:tabular-nums;text-align:center;padding:0 4px}
.campo.hora{flex:0 0 84px}
.campo.n{flex:0 0 74px}
.campo.mini{font-size:13px}
select.campo{appearance:none;background-image:none}
.campo:disabled{color:var(--dimmer);border-style:dashed}
.txt{min-height:74px;padding:9px 10px;resize:vertical;line-height:1.5;font-size:13.5px}
.x{appearance:none;cursor:pointer;flex:0 0 auto;width:38px;height:38px;background:none;border:1px solid var(--edge);border-radius:9px;
  color:var(--dimmer);font-size:15px;line-height:1}
.x:active{color:var(--signal);border-color:var(--signal)}
.mais{appearance:none;cursor:pointer;width:100%;margin-top:8px;background:none;border:1px dashed var(--edge);border-radius:9px;padding:10px;
  color:var(--dim);font-family:var(--display);font-size:12.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase}
.mais:active{color:var(--line1);border-color:var(--line1)}
.dica{font-size:12.5px;color:var(--dim);margin:-2px 0 10px;line-height:1.5}
.dica b{color:var(--chalk);font-weight:600}
.selo{position:sticky;top:0;z-index:2;margin:-14px calc(var(--pad) * -1) 12px;padding:9px var(--pad);
  background:var(--panel-2);border-bottom:1px solid var(--edge);
  font-family:var(--display);font-size:12.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.selo.ok{color:var(--line1)}
.selo.ruim{color:var(--signal)}

/* cronômetro de descanso */
.timer{position:fixed;left:0;right:0;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom));z-index:55;
  display:grid;grid-template-columns:1fr auto auto auto;align-items:center;gap:10px;
  background:var(--panel-2);border-top:1px solid var(--edge);padding:11px var(--pad) 12px}
.timer[hidden]{display:none}
.trilho{position:absolute;left:0;right:0;top:0;height:2px;background:var(--edge)}
.trilho i{display:block;height:100%;background:var(--line2);transform-origin:left;transform:scaleX(1)}
.timer .quem{font-size:13px;color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.timer .tt{font-family:var(--display);font-size:30px;font-weight:600;line-height:1;color:var(--line2);font-variant-numeric:tabular-nums}
.timer .bt{color:var(--dim)}
.timer .bt:active{color:var(--chalk);border-color:var(--chalk)}
body.cronometrando{padding-bottom:calc(var(--nav-h) + 62px + env(safe-area-inset-bottom))}

/* pop-up de fim de descanso */
.alarme{position:fixed;inset:0;z-index:80;display:flex;align-items:center;justify-content:center;padding:24px;
  background:rgba(13,20,27,.9);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);animation:rise .2s ease}
.alarme[hidden]{display:none}
.alarme-card{width:100%;max-width:320px;background:var(--panel);border:1px solid var(--signal);border-radius:15px;padding:26px 20px 20px;text-align:center}
.alarme-tit{font-family:var(--display);font-size:27px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;line-height:1.1;color:var(--signal)}
.alarme-ex{font-size:14px;color:var(--dim);margin-top:8px;min-height:21px}
.alarme-ok{appearance:none;cursor:pointer;width:100%;margin-top:20px;background:var(--signal);border:none;border-radius:11px;padding:14px;
  color:var(--ink);font-family:var(--display);font-size:15px;font-weight:700;letter-spacing:.14em;text-transform:uppercase}

/* o convite reaproveita o cartão do alarme, mas não é um alerta:
   precisa vir depois para vencer a borda vermelha por ordem */
.convite-card{border-color:var(--line1)}
.convite-card .alarme-tit{color:var(--line1)}
#conviteBotoes .acao,#conviteBotoes .wipe{margin-top:9px}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

   2. REGISTRO — persistência no aparelho

const LOG = (() => {
  const KEY = "rotina:log:v1";
  let dados = {}, persiste = true;
  try { const cru = localStorage.getItem(KEY); dados = cru ? JSON.parse(cru) : {}; }
  catch (e) { persiste = false; dados = {}; }

  const salvar = () => {
    if (!persiste) return;
    try { localStorage.setItem(KEY, JSON.stringify(dados)); } catch (e) { persiste = false; }
  };

  return {
    get persiste(){ return persiste; },
    dia: k => dados[k] || { t:false, d:false },
    alterna(k, campo){
      const at = dados[k] || { t:false, d:false };
      at[campo] = !at[campo];
      if (!at.t && !at.d) delete dados[k]; else dados[k] = at;
      salvar();
    },
    apagarTudo(){ dados = {}; salvar(); try{ localStorage.removeItem(KEY); }catch(e){} }
  };
})();

  catch (e) { persiste = false; dados = {}; }

  const salvar = () => {
    if (!persiste) return;
    try { localStorage.setItem(KEY, JSON.stringify(dados)); } catch (e) { persiste = false; }
  };
  const serie = nome => dados[chaveEx(nome)] || [];

  return {
    get persiste(){ return persiste; },
    serie,
    ultima(nome){ const s = serie(nome); return s.length ? s[s.length-1] : null; },
    registrar(nome, peso, reps){
      const k = chaveEx(nome), hj = chave(new Date());
      const lista = dados[k] || [];
      const doDia = lista.find(r => r.d === hj);
      if (doDia){ doDia.p = peso; doDia.r = reps; }
      else { lista.push({ d:hj, p:peso, r:reps }); lista.sort((a,b) => a.d < b.d ? -1 : 1); }
      dados[k] = lista;
      salvar();
    },
    apagarTudo(){ dados = {}; salvar(); try{ localStorage.removeItem(KEY); }catch(e){} }
  };
})();

/* Confere um plano vindo de fora antes de deixá-lo entrar.
   Sem isso, um JSON torto deixa o app em branco e sem saída.
   Devolve a lista de problemas — vazia quer dizer que passou. */
function validaPlano(p){
  if (!p || typeof p !== "object" || Array.isArray(p)) return ["O plano precisa ser um objeto JSON, entre { e }."];

  const erros = [];
  const conhecidas = Object.keys(PLANO_PADRAO);
  Object.keys(p).forEach(k => {
    if (!conhecidas.includes(k)) erros.push(`Chave desconhecida: "${k}". As válidas são ${conhecidas.join(", ")}.`);
  });

  if ("treinos" in p){
    if (!p.treinos || typeof p.treinos !== "object" || !Object.keys(p.treinos).length){
      erros.push("`treinos` precisa ser um objeto com pelo menos um treino.");
    } else Object.entries(p.treinos).forEach(([id,t])=>{
      if (!t || typeof t.nome !== "string" || !t.nome.trim()) erros.push(`Treino "${id}": falta o nome.`);
      if (!Array.isArray(t.ex) || !t.ex.length) erros.push(`Treino "${id}": falta a lista de exercícios.`);
      else t.ex.forEach((e,i)=>{
        if (!Array.isArray(e) || typeof e[0] !== "string" || !e[0].trim()) erros.push(`Treino "${id}", exercício ${i+1}: falta o nome.`);
        else if (typeof e[1] !== "string") erros.push(`Exercício "${e[0]}": falta o "séries x reps".`);
      });
    });
  }

  if ("dias" in p){
    const treinos = p.treinos || PLANO_PADRAO.treinos;
    if (!p.dias || typeof p.dias !== "object") erros.push("`dias` precisa ser um objeto com os sete dias.");
    else for (let d = 0; d < 7; d++){
      const dia = p.dias[d];
      if (!dia){ erros.push(`Falta o dia ${d} (0 é domingo, 1 é segunda).`); continue; }
      if (typeof dia.nome !== "string" || typeof dia.abbr !== "string") erros.push(`Dia ${d}: precisa de "nome" e "abbr".`);
      if (dia.treino != null && !treinos[dia.treino]) erros.push(`Dia ${d}: o treino "${dia.treino}" não existe na lista de treinos.`);
      if (!Array.isArray(dia.rota)){ erros.push(`Dia ${d}: "rota" precisa ser uma lista.`); continue; }
      let ant = -1;
      dia.rota.forEach((parada,i)=>{
        const ref = `Dia ${d}, parada ${i+1}`;
        if (!parada || !/^([01]\d|2[0-3]):[0-5]\d$/.test(parada.t)) { erros.push(`${ref}: "t" precisa ser um horário "HH:MM".`); return; }
        if (typeof parada.l !== "string" || !parada.l.trim()) erros.push(`${ref}: falta o texto em "l".`);
        /* sem usar min(), da seção 3: o validador roda antes dela existir */
        const m = Number(parada.t.slice(0,2)) * 60 + Number(parada.t.slice(3));
        if (m < ant) erros.push(`${ref} (${parada.t}): as paradas precisam estar em ordem crescente de horário.`);
        ant = m;
      });
    }
  }

  if ("meta" in p){
    if (!p.meta || typeof p.meta !== "object") erros.push("`meta` precisa ser um objeto.");
    else ["kcal","ptn","cho","gord","peso"].forEach(k=>{
      if (typeof p.meta[k] !== "number" || !Number.isFinite(p.meta[k])) erros.push(`meta.${k} precisa ser um número.`);
    });
  }

  /* Os textos do plano vão para a tela como HTML — é o que deixa
     <em> destacar um item de refeição. Como o plano agora pode vir
     de um link ou de um arquivo de outra pessoa, só essas quatro
     etiquetas passam; qualquer outra coisa parecida com marcação é
     recusada antes de chegar perto da tela. */
  const perigo = (txt) => {
    if (/javascript:/i.test(txt) || /\son\w+\s*=/i.test(txt)) return true;
    return (txt.match(/<\/?\s*[a-zA-Z][^>]*>/g) || []).some(tag =>
      !/^<\/?\s*(em|b|strong|small)\s*>$/i.test(tag));
  };
  const varrer = (valor, caminho) => {
    if (typeof valor === "string"){ if (perigo(valor)) erros.push(`O texto em "${caminho}" tem marcação que não é permitida. Só <em>, <b>, <strong> e <small> podem entrar.`); }
    else if (Array.isArray(valor)) valor.forEach((v,i)=>varrer(v, `${caminho}.${i}`));
    else if (valor && typeof valor === "object") Object.entries(valor).forEach(([k,v])=>varrer(v, `${caminho}.${k}`));
  };
  Object.entries(p).forEach(([k,v])=>varrer(v,k));

  return erros;
}

/* O plano do próprio usuário, montado no aparelho.
   Sobrescreve o PLANO_PADRAO por chave de primeiro nível: quem
   salva "dias" troca os sete dias inteiros, e o resto continua
   vindo do padrão. Nada de mesclar dia a dia — meio plano do
   usuário com meio plano padrão daria um dia que não existe. */
const PLANO_USUARIO = (() => {
  const KEY = "rotina:plano:v1";
  let dados = null, persiste = true, existe = false, invalido = false;

  /* escotilha de emergência: abrir com ?padrao=1 ignora o plano salvo */
  let ignorando = false;
  try { ignorando = new URLSearchParams(location.search).has("padrao"); } catch (e) {}

  try {
    const cru = localStorage.getItem(KEY);
    if (cru){
      existe = true;
      const obj = JSON.parse(cru);
      if (validaPlano(obj).length) invalido = true;
      else if (!ignorando) dados = obj;
    }
  } catch (e) { persiste = false; existe = false; }

  return {
    get persiste(){ return persiste; },
    get existe(){ return existe; },
    get ativo(){ return !!dados; },
    get ignorando(){ return ignorando && existe; },
    get invalido(){ return invalido; },
    dados: () => dados,
    /* devolve a lista de erros; vazia quer dizer que salvou */
    salvar(obj){
      const erros = validaPlano(obj);
      if (erros.length) return erros;
      if (!persiste) return ["Este navegador está bloqueando o armazenamento local."];
      try { localStorage.setItem(KEY, JSON.stringify(obj)); }
      catch (e) { return ["Não foi possível salvar — o armazenamento do navegador está cheio ou bloqueado."]; }
      dados = obj; existe = true; invalido = false;
      return [];
    },
    /* grava uma chave só, preservando as outras que o usuário já tinha.
       É o que o editor usa: mexer na escala não deve tocar nas metas. */
    salvarChave(chave, valor){
      return this.salvar(Object.assign({}, dados || {}, { [chave]: valor }));
    },
    apagar(){ dados = null; existe = false; invalido = false; try{ localStorage.removeItem(KEY); }catch(e){} }
  };
})();

/* É este objeto que todas as telas leem. Não é const porque o editor
   troca o plano em memória e manda as telas se redesenharem, sem
   recarregar a página no meio de uma edição. */
let PLANO = Object.assign({}, PLANO_PADRAO, PLANO_USUARIO.dados());

function reconstruirPlano(){
  PLANO = Object.assign({}, PLANO_PADRAO, PLANO_USUARIO.dados());
}

/* aceita "52,5" e "52.5"; devolve null se estiver fora da faixa ou vazio */
const numero = (txt, minimo, maximo) => {
  const v = parseFloat(String(txt).replace(",", ".").trim());
  return Number.isFinite(v) && v >= minimo && v <= maximo ? v : null;
};
const fmtNum = v => (Math.round(v*10)/10).toString().replace(".", ",");
const fmtDiaCurto = k => {
  const d = new Date(k + "T12:00:00");
  return `${d.getDate()}/${String(d.getMonth()+1).padStart(2,"0")}`;
};
const fmtDiaLongo = k => {
  const d = new Date(k + "T12:00:00");
  return k === chave(new Date()) ? "hoje" : `${PLANO.dias[d.getDay()].abbr.toLowerCase()} ${fmtDiaCurto(k)}`;
};
const mmss = seg => `${Math.floor(seg/60)}:${String(seg%60).padStart(2,"0")}`;

/* Gráfico de linha em SVG, sem biblioteca.
   pontos: [{d:"AAAA-MM-DD", v:número}] já em ordem crescente de data.
   opts.mini = sparkline (sem eixo nem rótulo), para dentro do exercício. */
function grafico(pontos, cor, opts = {}){
  if (!pontos.length) return "";
  const mini = !!opts.mini;
  const L = 300, A = mini ? 40 : 120;
  const esq = mini ? 3 : 38, dir = mini ? 3 : 8, topo = mini ? 6 : 12, base = mini ? 6 : 24;

  const vs = pontos.map(p => p.v);
  let lo = Math.min(...vs), hi = Math.max(...vs);
  if (hi - lo < 0.01){ lo -= 1; hi += 1; }
  const x = i => esq + (L - esq - dir) * (pontos.length === 1 ? .5 : i/(pontos.length - 1));
  const y = v => topo + (A - topo - base) * (1 - (v - lo)/(hi - lo));

  const linha = pontos.length > 1
    ? `<polyline points="${pontos.map((p,i)=>`${x(i).toFixed(1)},${y(p.v).toFixed(1)}`).join(" ")}" fill="none" stroke="${cor}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>`
    : "";
  const bolas = pontos.map((p,i) =>
    `<circle cx="${x(i).toFixed(1)}" cy="${y(p.v).toFixed(1)}" r="${i === pontos.length-1 ? 3.4 : 2.2}" fill="${cor}"/>`).join("");

  const eixo = mini ? "" : `
    <line x1="${esq}" y1="${y(hi).toFixed(1)}" x2="${L-dir}" y2="${y(hi).toFixed(1)}" stroke="var(--edge)" stroke-width="1"/>
    <line x1="${esq}" y1="${y(lo).toFixed(1)}" x2="${L-dir}" y2="${y(lo).toFixed(1)}" stroke="var(--edge)" stroke-width="1"/>
    <text class="gt" x="${esq-6}" y="${(y(hi)+3.5).toFixed(1)}" text-anchor="end">${fmtNum(hi)}</text>
    <text class="gt" x="${esq-6}" y="${(y(lo)+3.5).toFixed(1)}" text-anchor="end">${fmtNum(lo)}</text>
    <text class="gt" x="${esq}" y="${A-7}">${fmtDiaCurto(pontos[0].d)}</text>
    ${pontos.length > 1 ? `<text class="gt" x="${L-dir}" y="${A-7}" text-anchor="end">${fmtDiaCurto(pontos[pontos.length-1].d)}</text>` : ""}`;

  return `<svg class="graf" viewBox="0 0 ${L} ${A}" role="img" aria-label="${opts.alt || "gráfico de evolução"}">${eixo}${linha}${bolas}</svg>`;
}

/* =========================================================
   5. CRONÔMETRO DE DESCANSO
   Conta pelo instante de término, nunca decrementando um número:
   o navegador congela timers com o app em segundo plano, mas o
   relógio do aparelho continua. Assim a conta nunca atrasa.
   ========================================================= */

const CRON = (() => {
  let fim = 0, total = 0, nome = "", tique = null, audio = null;

  const som = () => {
    if (!audio) return;
    try {
      const t0 = audio.currentTime;
      [0, .3, .6].forEach((atraso, i) => {
        const osc = audio.createOscillator(), vol = audio.createGain();
        osc.type = "sine";
        osc.frequency.value = i === 2 ? 1180 : 880;
        vol.gain.setValueAtTime(.0001, t0 + atraso);
        vol.gain.exponentialRampToValueAtTime(.3, t0 + atraso + .02);
        vol.gain.exponentialRampToValueAtTime(.0001, t0 + atraso + .22);
        osc.connect(vol); vol.connect(audio.destination);
        osc.start(t0 + atraso); osc.stop(t0 + atraso + .24);
      });
    } catch (e) {}
  };

  const esconder = () => {
    clearInterval(tique); tique = null;
    $("#timer").hidden = true;
    document.body.classList.remove("cronometrando");
  };

  const tocar = () => {
    esconder();
    $("#alarmeEx").textContent = nome;
    $("#alarme").hidden = false;
    $("#alarmeOk").focus();
    som();
    try { navigator.vibrate([200,100,200]); } catch (e) {}
  };

  const pintar = () => {
    const resta = Math.max(0, fim - Date.now());
    $("#timerT").textContent = mmss(Math.ceil(resta/1000));
    $("#timerBarra").style.transform = `scaleX(${total ? resta/(total*1000) : 0})`;
    if (resta <= 0) tocar();
  };

  return {
    comeca(segundos, exercicio){
      /* o AudioContext só nasce liberado se criado dentro de um toque —
         é a única forma de o iPhone deixar o bipe tocar depois. */
      try {
        audio = audio || new (window.AudioContext || window.webkitAudioContext)();
        if (audio.state === "suspended") audio.resume();
      } catch (e) { audio = null; }

      nome = exercicio; total = segundos; fim = Date.now() + segundos*1000;
      $("#alarme").hidden = true;
      $("#timerNome").textContent = exercicio;
      $("#timer").hidden = false;
      document.body.classList.add("cronometrando");
      clearInterval(tique);
      tique = setInterval(pintar, 250);
      pintar();
    },
    soma(segundos){ if (!tique) return; fim += segundos*1000; total += segundos; pintar(); },
    cancela(){ esconder(); },
    /* ao voltar do segundo plano: se o prazo já venceu, o alarme dispara
       atrasado em vez de simplesmente não acontecer. */
    revisa(){ if (tique) pintar(); },
    get fim(){ return fim; },
    set fim(v){ fim = v; }
  };
})();

/* Salvar carga NÃO re-renderiza a aba: renderTreino reconstrói todos os
   <details> e fecharia os treinos abertos no meio da série. Aqui só a linha
   daquele exercício é trocada — a única exceção deliberada à regra de
   reconstruir a tela inteira. */
function atualizaExercicio(bloco, nome){
  bloco.querySelector("[data-ult]").outerHTML = ultimaCarga(nome);
  bloco.querySelector("[data-spark]").innerHTML = sparkCarga(nome);
  const u = CARGAS.ultima(nome);
  if (u){
    bloco.querySelector(".kg").placeholder = fmtNum(u.p);
    bloco.querySelector(".rp").placeholder = u.r ? String(u.r) : "reps";
  }
}

function ligarTreino(){
  document.querySelectorAll("#v-treino .ex").forEach(bloco=>{
    const nome = bloco.dataset.ex;
    const kg = bloco.querySelector(".kg"), rp = bloco.querySelector(".rp");
    const botao = bloco.querySelector(".salvar");

    const salvar = () => {
      const peso = numero(kg.value, 0, 500);
      if (peso === null){
        kg.classList.add("erro"); kg.focus();
        setTimeout(()=>kg.classList.remove("erro"), 1200);
        return;
      }
      CARGAS.registrar(nome, peso, numero(rp.value, 1, 100));
      kg.value = ""; rp.value = "";
      kg.blur(); rp.blur();
      atualizaExercicio(bloco, nome);
      botao.textContent = "Salvo"; botao.classList.add("ok");
      setTimeout(()=>{ botao.textContent = "Salvar"; botao.classList.remove("ok"); }, 1500);
      renderGraficoCarga();
    };

    botao.addEventListener("click", salvar);
    [kg,rp].forEach(campo => campo.addEventListener("keydown", e => { if (e.key === "Enter") salvar(); }));
    bloco.querySelector(".desc").addEventListener("click", e =>
      CRON.comeca(Number(e.currentTarget.dataset.seg), nome));
  });
}

/* =========================================================
   8. TELA: REGISTRO
   ========================================================= */

function estatisticas(janela){
  const h = hoje();
  let trFeitos=0, trPrevistos=0, dtFeitos=0, dtDias=0;
  for (let i=0;i<janela;i++){
    const d = somaDias(h,-i), est = LOG.dia(chave(d));
    dtDias++; if (est.d) dtFeitos++;
    if (treinaEm(d.getDay())){ trPrevistos++; if (est.t) trFeitos++; }
  }
  let seq = 0, inicio = LOG.dia(chave(h)).d ? 0 : 1;
  for (let i=inicio;i<400;i++){ if (LOG.dia(chave(somaDias(h,-i))).d) seq++; else break; }
  return { trFeitos, trPrevistos, trPct: trPrevistos?Math.round(trFeitos/trPrevistos*100):0,
           dtFeitos, dtDias, dtPct: dtDias?Math.round(dtFeitos/dtDias*100):0, seq };
}

function renderRegistro(){
  const h = hoje(), st = estatisticas(28);
  const offSeg = (h.getDay()+6)%7;
  const inicio = somaDias(somaDias(h,6-offSeg),-41);

  let celulas = "";
  for (let i=0;i<42;i++){
    const d = somaDias(inicio,i), k = chave(d), futuro = d > h;
    const est = LOG.dia(k), prev = treinaEm(d.getDay());
    const cls = ["cell", futuro?"future":"", k===chave(h)?"today":"", k===selecionado?"sel":""].filter(Boolean).join(" ");
    celulas += `<button class="${cls}" data-dia="${k}" type="button" ${futuro?"disabled":""}>
      <span class="d">${d.getDate()}</span>
      <span class="pips"><i class="pip t ${est.t?"on":(prev?"":"off")}"></i><i class="pip d ${est.d?"on":""}"></i></span>
    </button>`;
  }

  const dSel = new Date(selecionado + "T12:00:00");
  const ehHoje = selecionado === chave(h);

  $("#v-registro").innerHTML = `
    <h2 class="sec">Últimas 4 semanas</h2>
    <div class="stats">
      <div class="stat t"><div class="v">${st.trPct}<span>%</span></div><div class="k">Treinos<br>${st.trFeitos} de ${st.trPrevistos}</div></div>
      <div class="stat d"><div class="v">${st.dtPct}<span>%</span></div><div class="k">Dieta<br>${st.dtFeitos} de ${st.dtDias}</div></div>
      <div class="stat s"><div class="v">${st.seq}</div><div class="k">Dias<br>seguidos</div></div>
    </div>

    <h2 class="sec">Histórico</h2>
    <div class="calhead"><div>Seg</div><div>Ter</div><div>Qua</div><div>Qui</div><div>Sex</div><div>Sáb</div><div>Dom</div></div>
    <div class="cal" id="cal">${celulas}</div>
    <div class="legend">
      <span><i style="background:var(--line2)"></i> Treino</span>
      <span><i style="background:var(--line1)"></i> Dieta</span>
      <span><i style="background:var(--edge)"></i> Não marcado</span>
      <span><i style="border:1px solid var(--edge)"></i> Sem treino previsto</span>
    </div>

    <h2 class="sec">${ehHoje?"Hoje":"Dia selecionado"}</h2>
    <p class="selday"><b>${PLANO.dias[dSel.getDay()].nome}</b>, ${dSel.getDate()}/${String(dSel.getMonth()+1).padStart(2,"0")}</p>
    ${marcadores(selecionado,false)}
    <div class="note quiet">Toque em qualquer dia do histórico para corrigir uma marcação esquecida.</div>
    ${LOG.persiste?"":`<div class="note alert">Este navegador está bloqueando o armazenamento local — as marcações vão sumir ao fechar.</div>`}

    <h2 class="sec">Carga por exercício</h2>
    <div id="grafCarga"></div>

    <h2 class="sec">Peso corporal</h2>
    <div id="grafPeso"></div>

    <h2 class="sec">Meu plano</h2>
    <div id="meuPlano"></div>

    <h2 class="sec">Dados</h2>
    <button class="wipe" id="wipe" type="button">Apagar marcações do calendário</button>
    <button class="wipe" id="wipeTreino" type="button">Apagar cargas e pesos</button>
    <div class="foot">Tudo fica salvo apenas neste aparelho. Nada é enviado para lugar nenhum.</div>`;

  ligarMarcadores("#v-registro");
  document.querySelectorAll("#cal .cell:not(.future)").forEach(c=>
    c.addEventListener("click", ()=>{ selecionado = c.dataset.dia; renderRegistro(); }));
  $("#wipe").addEventListener("click", ()=>{
    if (confirm("Apagar todas as marcações do calendário? As cargas e os pesos ficam. Não dá para desfazer.")){
      LOG.apagarTudo(); renderRegistro(); renderHoje();
    }
  });
  $("#wipeTreino").addEventListener("click", ()=>{
    if (confirm("Apagar todo o histórico de carga dos exercícios e de peso corporal? Não dá para desfazer.")){
      CARGAS.apagarTudo(); PESO.apagarTudo();
      renderTreino(); renderDieta(); renderGraficoCarga(); renderGraficoPeso();
    }
  });

  renderGraficoCarga();

}

/* ---------- meu plano: exportar, colar, importar ---------- */

function renderMeuPlano(){
  const alvo = $("#meuPlano");
  if (!alvo) return;

  const estado = PLANO_USUARIO.ignorando
      ? `<div class="note alert">O app está aberto no <strong>plano padrão</strong> porque o plano salvo neste aparelho deu erro ao carregar. Corrija o texto e aplique de novo, ou volte ao padrão de vez.</div>`
    : PLANO_USUARIO.invalido
      ? `<div class="note alert">Existe um plano salvo neste aparelho, mas ele <strong>não passou na conferência</strong> e foi ignorado. O app está usando o plano padrão.</div>`
    : PLANO_USUARIO.ativo
      ? `<div class="note">Você está usando um <strong>plano próprio</strong>, salvo só neste aparelho.</div>`
      : `<div class="note info">Você está usando o <strong>plano padrão</strong>. Edite o que for seu — a escala, os treinos, as metas — e ele passa a ser o seu plano, só neste aparelho.</div>`;

  alvo.innerHTML = `
    ${estado}
    <button class="acao" id="planoEditar" type="button">Editar meu plano</button>
    <button class="acao" id="planoLink" type="button">Criar link para mandar a alguém</button>
    <div id="planoAviso"></div>

    <details class="fold" id="planoAvancado" style="margin-top:9px">
      <summary>
        <span class="idx">JSON</span>
        <span class="nm">Backup e importação<small>o plano como texto, para guardar ou receber</small></span>
        <span class="kc">·</span>
      </summary>
      <div class="corpo">
        <button class="acao" id="planoCopiar" type="button">Copiar plano</button>
        <button class="acao" id="planoBaixar" type="button">Baixar arquivo</button>
        <textarea class="cola" id="planoCola" spellcheck="false" placeholder="Cole aqui um plano em JSON" aria-label="Plano em JSON"></textarea>
        <button class="acao" id="planoAplicar" type="button">Aplicar plano colado</button>
        <label class="acao" for="planoArquivo">Abrir arquivo</label>
        <input type="file" id="planoArquivo" accept="application/json,.json" hidden>
        <p class="dica" style="margin-top:10px">Quem montou um plano longo deveria baixar o arquivo de vez em quando — é o único backup que existe.</p>
      </div>
    </details>

    ${PLANO_USUARIO.existe ? `<button class="wipe" id="planoPadrao" type="button" style="margin-top:9px">Voltar ao plano padrão</button>` : ""}`;

  const aviso = $("#planoAviso");
  const dizer = (texto, tipo="info") => { aviso.innerHTML = `<div class="note ${tipo}">${texto}</div>`; };
  const listarErros = erros => {
    aviso.innerHTML = `<div class="note alert"><strong>O plano não foi aplicado.</strong>
      <ul class="erros">${erros.slice(0,8).map(e=>`<li>${e}</li>`).join("")}</ul>
      ${erros.length > 8 ? `<span class="muted">e mais ${erros.length-8}.</span>` : ""}</div>`;
  };

  const texto = () => JSON.stringify(PLANO, null, 2);
  /* a caixa mora dentro do bloco recolhido — de nada adianta
     escrever nela sem abrir o bloco primeiro */
  const mostrarNaCaixa = valor => {
    const bloco = $("#planoAvancado");
    if (bloco) bloco.open = true;
    $("#planoCola").value = valor;
  };
  /* recarrega limpando o ?padrao=1, se estiver na URL */
  const recarregar = () => { location.href = location.pathname; };

  const aplicar = cru => {
    let obj;
    try { obj = JSON.parse(cru); }
    catch (e) { listarErros([`O texto não é um JSON válido: ${e.message}`]); return; }
    const erros = PLANO_USUARIO.salvar(obj);
    if (erros.length) listarErros(erros);
    else recarregar();
  };

  $("#planoEditar").addEventListener("click", abrirEditor);

  $("#planoLink").addEventListener("click", async ()=>{
    const meu = PLANO_USUARIO.dados();
    if (!meu){
      dizer("Você ainda está no plano padrão — quem abrir o app já recebe ele. Monte o seu primeiro, em Editar meu plano.", "quiet");
      return;
    }
    try {
      const link = `${location.origin}${location.pathname}#plano=${await codificaPlano(meu)}`;
      if (link.length > 8000){
        dizer("Seu plano ficou grande demais para caber num link. Use <strong>Copiar plano</strong> ou <strong>Baixar arquivo</strong> para mandar.", "alert");
        return;
      }
      try { await navigator.clipboard.writeText(link); dizer(`Link copiado (${link.length} caracteres). Quem abrir vê o plano e escolhe se aplica.`, "info"); }
      catch (e) { mostrarNaCaixa(link); dizer("O link está na caixa em Backup e importação — selecione e copie.", "quiet"); }
    } catch (e) { dizer("Não foi possível montar o link neste navegador.", "alert"); }
  });

  $("#planoCopiar").addEventListener("click", ()=>{
    const cru = texto();
    try {
      navigator.clipboard.writeText(cru)
        .then(()=>dizer("Plano copiado. Cole num editor de texto para trabalhar nele."))
        .catch(()=>{ mostrarNaCaixa(cru); dizer("Não deu para copiar sozinho — o plano está na caixa acima, selecione e copie.", "quiet"); });
    } catch (e) {
      mostrarNaCaixa(cru);
      dizer("Não deu para copiar sozinho — o plano está na caixa em Backup e importação, selecione e copie.", "quiet");
    }
  });

  $("#planoBaixar").addEventListener("click", ()=>{
    try {
      const url = URL.createObjectURL(new Blob([texto()], { type:"application/json" }));
      const a = document.createElement("a");
      a.href = url; a.download = `plano-${chave(new Date())}.json`;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(()=>URL.revokeObjectURL(url), 1000);
    } catch (e) { dizer("Este navegador não deixou baixar o arquivo. Use o botão de copiar.", "alert"); }
  });

  $("#planoAplicar").addEventListener("click", ()=>{
    const cru = $("#planoCola").value.trim();
    if (!cru){ dizer("Cole um plano na caixa antes de aplicar.", "quiet"); return; }
    aplicar(cru);
  });

  $("#planoArquivo").addEventListener("change", e=>{
    const arq = e.target.files && e.target.files[0];
    if (!arq) return;
    const leitor = new FileReader();
    leitor.onload = () => aplicar(String(leitor.result));
    leitor.onerror = () => dizer("Não foi possível ler o arquivo.", "alert");
    leitor.readAsText(arq);
  });

  const voltar = $("#planoPadrao");
  if (voltar) voltar.addEventListener("click", ()=>{
    if (confirm("Voltar ao plano padrão? O plano salvo neste aparelho será apagado. As marcações, cargas e pesos ficam.")){
      PLANO_USUARIO.apagar();
      recarregar();
    }
  });
}

/* ---------- gráfico: peso corporal ---------- */

/* kg por semana, medido entre o primeiro e o último peso dos últimos 21 dias */
function ritmoSemanal(){
  const s = PESO.serie();
  if (s.length < 2) return null;
  const limite = chave(somaDias(hoje(), -21));
  const janela = s.filter(r => r.d >= limite);
  if (janela.length < 2) return null;
  const a = janela[0], b = janela[janela.length-1];
  const dias = (new Date(b.d) - new Date(a.d)) / 86400000;
  return dias >= 7 ? (b.p - a.p) / dias * 7 : null;
}

function variacao(dias){
  const s = PESO.serie();
  if (!s.length) return null;
  const limite = chave(somaDias(hoje(), -dias));
  const antigos = s.filter(r => r.d <= limite);
  const base = antigos.length ? antigos[antigos.length-1] : s[0];
  return base === s[s.length-1] ? null : s[s.length-1].p - base.p;
}

const sinal = v => `${v > 0 ? "+" : v < 0 ? "−" : ""}${fmtNum(Math.abs(v))}`;

function renderGraficoPeso(){
  const alvo = $("#grafPeso");
  if (!alvo) return;

  const s = PESO.serie(), ult = PESO.ultimo();
  const r = PLANO.ritmoPeso, ritmo = ritmoSemanal();
  const texto = ritmo === null ? r.poucos
              : ritmo > r.teto ? r.acima
              : ritmo < r.min  ? r.abaixo
              : r.dentro;
  const v7 = variacao(7), v30 = variacao(30);

  alvo.innerHTML = `
    <div class="campos">
      <input class="in" id="pesoIn" type="text" inputmode="decimal" placeholder="${ult?fmtNum(ult.p):"kg"}" aria-label="Peso corporal em kg">
      <button class="bt" id="pesoOk" type="button">Registrar</button>
    </div>
    ${s.length ? `
      <div class="card" style="margin-top:12px">
        ${grafico(s.map(x=>({d:x.d,v:x.p})), "var(--line1)", { alt:"peso corporal" })}
        <p class="resumo d">${ritmo === null ? `<b>${fmtNum(ult.p)} kg</b> · ${fmtDiaLongo(ult.d)}` : `<b>${sinal(ritmo)} kg</b> por semana`}</p>
      </div>
      <div class="stats">
        <div class="stat d"><div class="v">${fmtNum(ult.p)}</div><div class="k">kg<br>agora</div></div>
        <div class="stat s"><div class="v">${v7===null?"—":sinal(v7)}</div><div class="k">kg<br>em 7 dias</div></div>
        <div class="stat s"><div class="v">${v30===null?"—":sinal(v30)}</div><div class="k">kg<br>em 30 dias</div></div>
      </div>` : ""}
    <div class="note${ritmo !== null && (ritmo > r.teto || ritmo < r.min) ? " alert" : " info"}">${texto}</div>`;

  const campo = $("#pesoIn");
  const gravar = () => {
    const p = numero(campo.value, 25, 200);
    if (p === null){
      campo.classList.add("erro"); campo.focus();
      setTimeout(()=>campo.classList.remove("erro"), 1200);
      return;
    }
    PESO.registrar(p);
    campo.value = ""; campo.blur();
    renderGraficoPeso();
    renderDieta();
  };
  $("#pesoOk").addEventListener("click", gravar);
  campo.addEventListener("keydown", e => { if (e.key === "Enter") gravar(); });
}

function ligarMarcadores(escopo){

}

    <div class="note alert">"Não sentir sono desde pequeno" merece avaliação — pode ser síndrome do atraso de fase do sono, que tem tratamento específico. Um clínico geral ou médico do sono diferencia em uma consulta, e isso vale mais que qualquer suplemento.</div>

/* =========================================================
   10. EDITOR DO PLANO
   Painel de tela cheia, irmão do <nav>. Trabalha num rascunho —
   cópia profunda do plano em vigor — e grava a cada alteração.
   ========================================================= */

/* as chaves que o editor mexe. O resto do PLANO é teoria de treino
   e dieta, igual para todo mundo, e só muda colando um plano. */
const CHAVES_EDITAVEIS = ["meta","descansoSeg","treinos","dias","refeicoes","sono","onibus"];

const DIAS_SEMANA = [1,2,3,4,5,6,0];

let rascunho = null;

const escapa = s => String(s == null ? "" : s)
  .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");

function porCaminho(obj, caminho){
  const partes = caminho.split(".");
  let alvo = obj;
  for (let i = 0; i < partes.length - 1; i++) alvo = alvo[partes[i]];
  return { alvo, ultima: partes[partes.length-1] };
}

/* --- pedaços de formulário --- */

function campo(caminho, valor, o = {}){
  const attrs = [
    `class="campo ${o.classe||""}"`,
    `data-caminho="${caminho}"`,
    o.estrutural ? `data-estrutural="1"` : "",
    o.num ? `data-num="1" inputmode="decimal"` : "",
    o.lista ? `data-lista="1"` : "",
    `type="${o.hora ? "time" : "text"}"`,
    `value="${escapa(valor)}"`,
    o.ph ? `placeholder="${escapa(o.ph)}"` : "",
    `aria-label="${escapa(o.aria || o.ph || caminho)}"`,
    o.desabilitado ? "disabled" : ""
  ];
  return `<input ${attrs.filter(Boolean).join(" ")}>`;
}

function area(caminho, linhas, aria){
  return `<textarea class="campo txt" data-caminho="${caminho}" data-lista="1" spellcheck="false"
    aria-label="${escapa(aria)}">${escapa((linhas||[]).join("\n"))}</textarea>`;
}

function botaoX(acao, dados){
  const attrs = Object.entries(dados).map(([k,v])=>`data-${k}="${escapa(v)}"`).join(" ");
  return `<button class="x" type="button" data-acao="${acao}" ${attrs} aria-label="Remover">✕</button>`;
}

function botaoMais(acao, texto, dados = {}){
  const attrs = Object.entries(dados).map(([k,v])=>`data-${k}="${escapa(v)}"`).join(" ");
  return `<button class="mais" type="button" data-acao="${acao}" ${attrs}>${texto}</button>`;
}

function bloco(idx, titulo, sub, conta, corpo){
  return `<details class="fold">
    <summary>
      <span class="idx">${idx}</span>
      <span class="nm">${titulo}<small>${sub}</small></span>
      <span class="kc">${conta}</span>
    </summary>
    <div class="corpo">${corpo}</div>
  </details>`;
}

/* --- as seções --- */

function secaoEscala(){
  const opcoes = id => [`<option value="" ${!id?"selected":""}>Descanso</option>`]
    .concat(Object.entries(rascunho.treinos).map(([tid,t]) =>
      `<option value="${escapa(tid)}" ${tid===id?"selected":""}>${escapa(t.nome)}</option>`)).join("");

  const dias = DIAS_SEMANA.map(d=>{
    const dia = rascunho.dias[d];
    return `<div class="grupo">
      <div class="grupo-tit"><span>${escapa(dia.nome)}</span><span class="abbr">${escapa(dia.abbr)}</span></div>
      <div class="linha">
        <select class="campo" data-caminho="dias.${d}.treino" data-estrutural="1" data-nulo="1" aria-label="Treino de ${escapa(dia.nome)}">${opcoes(dia.treino)}</select>
        ${campo(`dias.${d}.hora`, dia.hora || "", { hora:1, classe:"hora", estrutural:1, desabilitado:!dia.treino, aria:`Horário do treino de ${dia.nome}` })}
      </div>
      ${campo(`dias.${d}.nota`, dia.nota, { classe:"mini", ph:"Recado do dia", aria:`Recado de ${dia.nome}` })}
    </div>`;
  }).join("");

  const treinando = DIAS_SEMANA.filter(d=>rascunho.dias[d].treino).length;
  return bloco("1", "Escala", "que treino em cada dia", `${treinando}×`,
    `<p class="dica">Trocar o treino ou o horário aqui move sozinho a parada do treino na rota daquele dia.</p>${dias}`);
}

function secaoMetas(){
  const m = rascunho.meta;
  const linha = (rot, chave, ph) => `<div class="rot">${rot}</div>${campo(`meta.${chave}`, m[chave], { num:1, classe:"n", ph })}`;
  return bloco("2", "Metas do dia", "calorias e macros", `${m.kcal}`,
    `<div class="linha">${linha("kcal","kcal")}</div>
     <p class="dica">Total de calorias do dia.</p>
     <div class="linha" style="gap:14px">
       <div>${linha("ptn g","ptn")}</div><div>${linha("cho g","cho")}</div><div>${linha("gord g","gord")}</div>
     </div>
     <p class="dica"><b>PTN</b> é proteína, <b>CHO</b> é carboidrato e <b>GORD</b> é gordura — as três em gramas por dia.</p>
     <div class="rot">Peso de referência (kg)</div>
     ${campo("meta.peso", m.peso, { num:1, classe:"n" })}

        ${campo(`treinos.${id}.ex.${i}.2`, e[2] || "", { classe:"mini", ph:"Nome no Hevy", aria:"Nome no Hevy" })}
      </div>

function secaoRotas(){
  const dias = DIAS_SEMANA.map(d=>{
    const dia = rascunho.dias[d];
    const paradas = dia.rota.map((p,i)=>{
      if (p.g) return `<div class="linha">
        ${campo(`dias.${d}.rota.${i}.t`, p.t, { hora:1, classe:"hora", desabilitado:1, aria:"Horário do treino" })}
        ${campo(`dias.${d}.rota.${i}.l`, p.l, { desabilitado:1, aria:"Treino" })}
      </div>
      <p class="dica">Esta parada vem da Escala — mude por lá.</p>`;
      return `<div class="linha">
        ${campo(`dias.${d}.rota.${i}.t`, p.t, { hora:1, classe:"hora", estrutural:1, aria:"Horário" })}
        ${campo(`dias.${d}.rota.${i}.l`, p.l, { ph:"O que acontece" })}
        ${botaoX("rm-parada", { d, i })}
      </div>
      <div class="linha" style="margin-bottom:13px">
        ${campo(`dias.${d}.rota.${i}.s`, p.s || "", { classe:"mini", ph:"Segunda linha (opcional)" })}
        <select class="campo" style="flex:0 0 104px" data-caminho="dias.${d}.rota.${i}.k" data-num="1" aria-label="Tipo da parada">
          <option value="" ${!p.k?"selected":""}>Comum</option>
          <option value="1" ${p.k?"selected":""}>Aula</option>
        </select>
      </div>`;
    }).join("");

    return `<div class="grupo">
      <div class="grupo-tit"><span>${escapa(dia.nome)}</span><span class="abbr">${dia.rota.length}</span></div>

  return bloco("4", "Rota de cada dia", "a linha do tempo da aba Hoje", "7",

function secaoRefeicoes(){

function secaoSono(){

    </div>

/* --- montagem e salvamento --- */

/* o selo vive fora do render porque o editor é reconstruído inteiro
   a cada mudança estrutural — sem isso o "Salvo" some no mesmo quadro */
let seloEstado = { texto:"Alterações salvas automaticamente", tipo:"" };

function renderEditor(){
  const corpo = $("#editorCorpo");
  /* guarda o que estava aberto e onde estava a rolagem: o editor é
     reconstruído por inteiro a cada mudança estrutural. */
  const abertos = [...corpo.querySelectorAll("details")].map(d=>d.open);
  const rolagem = corpo.scrollTop;

  corpo.innerHTML = `
    <div class="selo ${seloEstado.tipo}" id="editorSelo">${escapa(seloEstado.texto)}</div>
    ${secaoEscala()}${secaoMetas()}${secaoTreinos()}${secaoRotas()}${secaoRefeicoes()}${secaoSono()}
    <div class="foot">O que não está aqui — técnica, regras de sono, apetite, trocas — é teoria igual para todo mundo,
    e só muda colando um plano inteiro na aba Registro.</div>`;

  corpo.querySelectorAll("details").forEach((d,i)=>{ if (abertos[i]) d.open = true; });
  corpo.scrollTop = rolagem;
}

function selo(texto, tipo){
  seloEstado = { texto, tipo: tipo || "" };
  const el = $("#editorSelo");
  if (el){ el.className = `selo ${seloEstado.tipo}`; el.textContent = texto; }
}

function salvarRascunho(){
  const erros = validaPlano(rascunho);
  if (erros.length){ selo(erros[0], "ruim"); return false; }

  /* guarda só o que difere do padrão — quem mexeu só nas metas
     fica com um plano de três linhas, fácil de mandar para alguém. */
  const plano = Object.assign({}, PLANO_USUARIO.dados() || {});
  CHAVES_EDITAVEIS.forEach(k=>{
    if (JSON.stringify(rascunho[k]) === JSON.stringify(PLANO_PADRAO[k])) delete plano[k];
    else plano[k] = rascunho[k];
  });

  if (!Object.keys(plano).length){
    PLANO_USUARIO.apagar();
    selo("De volta ao plano padrão", "ok");
  } else {
    const problemas = PLANO_USUARIO.salvar(plano);
    if (problemas.length){ selo(problemas[0], "ruim"); return false; }
    selo("Salvo", "ok");
  }

  reconstruirPlano();
  TELAS.forEach(t=>t.fn());
  return true;
}

/* mantém a parada do treino na rota igual ao que a escala diz */
function sincronizaRota(d){
  const dia = rascunho.dias[d];
  dia.rota = dia.rota.filter(p=>!p.g);
  if (!dia.treino){ dia.hora = null; return; }
  if (!dia.hora) dia.hora = "06:00";
  const t = rascunho.treinos[dia.treino];
  dia.rota.push({ t:dia.hora, l:t.nome, s:t.dur || "", g:1 });
  dia.rota.sort((a,b)=>min(a.t) - min(b.t));
}

function abrirEditor(){
  if (!PLANO_USUARIO.persiste){
    alert("Este navegador está bloqueando o armazenamento local, então não dá para salvar um plano neste aparelho.");
    return;
  }
  rascunho = JSON.parse(JSON.stringify(PLANO));
  $("#editor").hidden = false;
  document.body.style.overflow = "hidden";
  renderEditor();
}

function fecharEditor(){
  $("#editor").hidden = true;
  document.body.style.overflow = "";
  rascunho = null;
  renderRegistro();
}

function ligarEditor(){
  const corpo = $("#editorCorpo");

  corpo.addEventListener("change", e=>{
    const el = e.target.closest("[data-caminho]");
    if (!el || !rascunho) return;

    let valor = el.value;
    if (el.dataset.lista) valor = valor.split("\n").map(l=>l.trim()).filter(Boolean);
    else if (el.dataset.num) valor = valor.trim() === "" ? null : Number(String(valor).replace(",","."));
    else valor = String(valor);

    const { alvo, ultima } = porCaminho(rascunho, el.dataset.caminho);
    /* campo opcional vazio some do plano; "treino" e "hora" guardam
       null, que é como o modelo escreve "dia de descanso". */
    if (valor === null || valor === "") {
      if (el.dataset.nulo) alvo[ultima] = null; else delete alvo[ultima];
    } else alvo[ultima] = valor;

    if (el.dataset.estrutural){
      const partes = el.dataset.caminho.split(".");
      /* renomear um treino tem que renomear a parada dele em todo dia
         que o usa, senão a rota fica falando do treino antigo. */
      if (partes[0] === "treinos") DIAS_SEMANA.forEach(sincronizaRota);
      if (partes[0] === "dias"){
        sincronizaRota(partes[1]);
        if (partes[2] === "rota") rascunho.dias[partes[1]].rota.sort((a,b)=>min(a.t)-min(b.t));
      }
      if (salvarRascunho()) renderEditor();
      return;
    }
    salvarRascunho();
  });

  corpo.addEventListener("click", e=>{
    const bt = e.target.closest("[data-acao]");
    if (!bt || !rascunho) return;
    const { acao, id, i, d } = bt.dataset;

    if (acao === "add-ex") rascunho.treinos[id].ex.push(["Novo exercício","3 x 10",""]);
    if (acao === "rm-ex") rascunho.treinos[id].ex.splice(Number(i),1);
    if (acao === "add-treino"){
      let n = 1; while (rascunho.treinos["treino"+n]) n++;
      rascunho.treinos["treino"+n] = { nome:"Treino "+n, nota:"", dur:"~60 min", ex:[["Novo exercício","3 x 10",""]] };
    }
    if (acao === "rm-treino"){
      const usado = DIAS_SEMANA.filter(dd=>rascunho.dias[dd].treino === id).map(dd=>rascunho.dias[dd].nome);
      if (usado.length){ selo(`"${rascunho.treinos[id].nome}" está na escala de ${usado.join(", ")}. Tire-o da escala primeiro.`, "ruim"); return; }
      if (Object.keys(rascunho.treinos).length === 1){ selo("Precisa sobrar pelo menos um treino.", "ruim"); return; }
      delete rascunho.treinos[id];
    }
    if (acao === "add-parada"){
      rascunho.dias[d].rota.push({ t:"12:00", l:"Nova parada" });
      rascunho.dias[d].rota.sort((a,b)=>min(a.t)-min(b.t));
    }
    if (acao === "rm-parada"){
      const dia = rascunho.dias[d];
      if (dia.rota[Number(i)].g){ selo("A parada do treino sai tirando o treino da escala.", "ruim"); return; }
      dia.rota.splice(Number(i),1);
    }
    if (acao === "add-refeicao") rascunho.refeicoes.push({ n:rascunho.refeicoes.length+1, nome:"Nova refeição", kcal:300, quando:"", itens:["Item"] });
    if (acao === "rm-refeicao") rascunho.refeicoes.splice(Number(i),1);
    if (acao === "add-sono") rascunho.sono.push(["Dias","22:30","06:30"]);
    if (acao === "rm-sono") rascunho.sono.splice(Number(i),1);
    if (acao === "add-onibus") rascunho.onibus.push(["12:00","Rota","~12:30"]);
    if (acao === "rm-onibus") rascunho.onibus.splice(Number(i),1);

    if (salvarRascunho()) renderEditor();
  });

  $("#editorFechar").addEventListener("click", fecharEditor);
}

/* =========================================================
   11. COMPARTILHAR E RECEBER PLANO
   O plano viaja no # do endereço, comprimido quando o navegador
   sabe: nada de servidor, e o link cabe numa mensagem.
   ========================================================= */

function paraBase64(bytes){
  let s = "";
  for (let i = 0; i < bytes.length; i += 8192) s += String.fromCharCode.apply(null, bytes.subarray(i, i+8192));
  return btoa(s).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
}
function deBase64(txt){
  const b = txt.replace(/-/g,"+").replace(/_/g,"/");
  const bin = atob(b + "=".repeat((4 - b.length % 4) % 4));
  const out = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
  return out;
}

async function codificaPlano(obj){
  const bytes = new TextEncoder().encode(JSON.stringify(obj));
  if (typeof CompressionStream === "function"){
    try {
      const cs = new CompressionStream("gzip");
      const w = cs.writable.getWriter(); w.write(bytes); w.close();
      return "g" + paraBase64(new Uint8Array(await new Response(cs.readable).arrayBuffer()));
    } catch (e) {}
  }
  return "p" + paraBase64(bytes);
}

async function decodificaPlano(carga){
  const bytes = deBase64(carga.slice(1));
  if (carga[0] === "g"){
    const ds = new DecompressionStream("gzip");
    const w = ds.writable.getWriter(); w.write(bytes); w.close();
    return JSON.parse(new TextDecoder().decode(new Uint8Array(await new Response(ds.readable).arrayBuffer())));
  }
  return JSON.parse(new TextDecoder().decode(bytes));
}

function resumoPlano(p){
  const partes = [];
  if (p.treinos) partes.push(`${Object.keys(p.treinos).length} treinos`);
  if (p.dias) partes.push(`${DIAS_SEMANA.filter(d=>p.dias[d] && p.dias[d].treino).length} dias de treino`);
  if (p.meta) partes.push(`${p.meta.kcal} kcal`);
  if (p.refeicoes) partes.push(`${p.refeicoes.length} refeições`);
  return partes.length ? partes.join(" · ") : "algumas mudanças";
}

/* --- o cartão de boas-vindas / plano recebido --- */

function mostrarConvite(titulo, texto, botoes){
  $("#conviteTit").textContent = titulo;
  $("#conviteTexto").innerHTML = texto;
  $("#conviteBotoes").innerHTML = botoes.map((b,i)=>
    `<button class="${b.perigo?"wipe":"acao"}" type="button" data-i="${i}">${b.rot}</button>`).join("");
  $("#conviteBotoes").querySelectorAll("button").forEach((el,i)=>
    el.addEventListener("click", ()=>{ fecharConvite(); botoes[i].fn(); }));
  $("#convite").hidden = false;
}
const fecharConvite = () => { $("#convite").hidden = true; };

const VISTO = "rotina:visto:v1";
const jaVisto = () => { try { return !!localStorage.getItem(VISTO); } catch(e){ return true; } };
const marcarVisto = () => { try { localStorage.setItem(VISTO,"1"); } catch(e){} };

function boasVindas(){
  mostrarConvite("Bem-vindo",
    "Este é um plano de exemplo — escala de treino, dieta e rotina de um estudante. Você pode usar como está ou trocar tudo pelo seu.",
    [
      { rot:"Usar este plano", fn:()=>{} },
      { rot:"Montar o meu plano", fn:()=>{ ir("registro"); abrirEditor(); } },
      { rot:"Colar um plano que me mandaram", fn:()=>{
          ir("registro");
          const bloco = $("#planoAvancado"), caixa = $("#planoCola");
          if (bloco) bloco.open = true;
          if (caixa){ caixa.scrollIntoView({ block:"center" }); caixa.focus(); }
        } }
    ]);
  marcarVisto();
}

/* plano vindo de link é conteúdo de fora: confere, resume e pergunta.
   Nunca aplica sozinho — do outro lado pode haver um plano já montado. */
async function planoDoEndereco(){
  const hash = location.hash || "";
  if (!hash.startsWith("#plano=")) return false;
  history.replaceState(null, "", location.pathname);

  let obj;
  try { obj = await decodificaPlano(decodeURIComponent(hash.slice(7))); }
  catch (e) { obj = null; }

  if (!obj){
    mostrarConvite("Link inválido", "O link que você abriu não trazia um plano legível. Peça para mandarem de novo.", [{ rot:"Fechar", fn:()=>{} }]);
    return true;
  }
  const erros = validaPlano(obj);
  if (erros.length){
    mostrarConvite("Plano com problema",
      `O plano deste link não passou na conferência:<br><br>${escapa(erros[0])}`, [{ rot:"Fechar", fn:()=>{} }]);
    return true;
  }

  const aviso = PLANO_USUARIO.existe
    ? "<br><br><strong>Isto substitui o plano que já está neste aparelho.</strong> Suas marcações, cargas e pesos ficam."
    : "";
  mostrarConvite("Plano compartilhado",
    `Alguém mandou um plano: <strong>${escapa(resumoPlano(obj))}</strong>.${aviso}`,
    [
      { rot:"Aplicar este plano", fn:()=>{ if (!PLANO_USUARIO.salvar(obj).length){ marcarVisto(); location.href = location.pathname; } } },
      { rot:"Manter o meu", fn:()=>{ marcarVisto(); }, perigo:1 }
    ]);
  return true;
}

/* =========================================================
   12. NAVEGAÇÃO
   ========================================================= */

const TELAS = [
  {id:"hoje",    rot:"Hoje",    ico:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>', fn:renderHoje},
  {id:"treino",  rot:"Treino",  ico:'<path d="M6 8v8M18 8v8M3 10v4M21 10v4M6 12h12"/>', fn:renderTreino},
  {id:"dieta",   rot:"Dieta",   ico:'<path d="M5 3v8a3 3 0 0 0 6 0V3M8 11v10M17 3c-1.5 2-2 4-2 6s.5 3 2 3 2-1 2-3-.5-4-2-6zM17 12v9"/>', fn:renderDieta},
  {id:"registro",rot:"Registro",ico:'<rect x="3" y="4" width="18" height="17" rx="2"/><path d="M8 2v4M16 2v4M3 10h18M9 15l2 2 4-4"/>', fn:renderRegistro},
  {id:"mais",    rot:"Mais",    ico:'<path d="M4 6h16M4 12h16M4 18h16"/><circle cx="8" cy="6" r="1.5"/><circle cx="15" cy="12" r="1.5"/><circle cx="11" cy="18" r="1.5"/>', fn:renderMais}
];

function ir(id){
  document.querySelectorAll(".view").forEach(v=>v.classList.toggle("on", v.id===`v-${id}`));
  document.querySelectorAll("#nav button").forEach(b=>{
    const on = b.dataset.id===id;
    b.classList.toggle("on", on);
    b.setAttribute("aria-current", on?"page":"false");
  });
  window.scrollTo({top:0});
}

function boot(){
  $("#nav").innerHTML = TELAS.map(t=>
    `<button data-id="${t.id}" type="button"><svg class="ico" viewBox="0 0 24 24">${t.ico}</svg>${t.rot}</button>`).join("");
  document.querySelectorAll("#nav button").forEach(b=>b.addEventListener("click",()=>ir(b.dataset.id)));

  /* Um plano salvo com defeito não pode deixar o app inutilizável:
     se o primeiro render quebrar, recarrega ignorando o plano do
     usuário — daí dá para corrigir ou apagar pela aba Registro. */
  try {
    TELAS.forEach(t=>t.fn());
  } catch (erro) {
    if (PLANO_USUARIO.ativo){ location.search = "?padrao=1"; return; }
    throw erro;
  }
  ir("hoje");

  /* pede ao navegador para não descartar o armazenamento — é onde
     mora o plano inteiro de quem montou o seu. */
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}

  const tick = () => {
    const d = new Date();
    $("#clock").textContent = String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0");
  };
  tick();
  setInterval(tick, 20000);
  setInterval(renderHoje, 60000);

  /* cronômetro */
  $("#timerMais").addEventListener("click", ()=>CRON.soma(30));
  $("#timerX").addEventListener("click", ()=>CRON.cancela());
  const fecharAlarme = () => { $("#alarme").hidden = true; };
  $("#alarmeOk").addEventListener("click", fecharAlarme);
  $("#alarme").addEventListener("click", e => { if (e.target === $("#alarme")) fecharAlarme(); });
  document.addEventListener("keydown", e => { if (e.key === "Escape") fecharAlarme(); });
  document.addEventListener("visibilitychange", ()=>{ if (!document.hidden) CRON.revisa(); });
  window.addEventListener("focus", ()=>CRON.revisa());
  window.__cron = CRON;   /* atalho para testar o alarme pelo console */

  /* editor, plano vindo de link e primeira abertura */
  ligarEditor();
  planoDoEndereco().then(veioPeloLink=>{
    if (!veioPeloLink && !jaVisto() && !PLANO_USUARIO.existe) boasVindas();
  });
  /* com o app já aberto na tela inicial, tocar num link de plano só
     troca o # — não recarrega nada. Sem isto, o link não faria nada. */
  window.addEventListener("hashchange", ()=>{ planoDoEndereco(); });

  /* offline — só funciona em https (Netlify) ou localhost, não em file:// */
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () =>
      navigator.serviceWorker.register("./sw.js").catch(()=>{}));
  }
}

boot();
</script>
